<!DOCTYPE html>

<html>

<head>
    <title>Terminal Simulator</title>

    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="styles/terminal.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
<body>
    <header>
        <div class="left">
            <button class="b1"></button>
            <button class="b2"></button>
            <button class="b3"></button>
        </div>
        <div class="middle">
            <p>user@terminal-simulator ~</p>
        </div>
        <div class="right"></div>
    </header>


    <main>
        <form id="prompt-form" data-id="1" class="prompt-space">
            <p>user@terminal-simulator ~ $</p>
            <input id="prompt-input" data-id="1">
        </form>

        <div class="output">
            Mode                 LastWriteTime         Length Name
            ----                 -------------         ------ ----
            d-----          7/5/2026  10:24 AM                .copilot
            d-----         4/18/2026   2:35 PM                .cursor
        </div>

    </main>

    <script src="/terminal-simulator/js/main.js" type="module"></script>
</body>


</html>
